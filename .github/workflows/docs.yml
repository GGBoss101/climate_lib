name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Replace 'furo' with your exact theme package name
          pip install sphinx furo 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Sphinx HTML
        run: |
          # 1. Automatically scan codebase for docstrings
          sphinx-apidoc -o docs/ . --force
          
          # 2. Build the documentation into HTML
          sphinx-build -b html docs docs/_build/html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
          branch: gh-pages

