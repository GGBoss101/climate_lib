name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # install theme
          pip install sphinx pydata_sphinx_theme 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # If you have a pyproject.toml or setup.py, uncomment the line below:
          # pip install -e .

      - name: Build Sphinx HTML
        run: |
          # 1. Automatically generate the code stubs into the docs folder
          sphinx-apidoc -o docs src/ --force
          
          # 2. Expose the src directory to Python so Sphinx can see the code during compilation
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src"
          
          # 3. Change directories into docs and run your standard make commands
          cd docs
          make clean
          make html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
          branch: gh-pages
