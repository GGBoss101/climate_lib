name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls all Git history/tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. Install semantic-release and downgrade the broken dependency locally
      - name: Install Release Tools
        run: |
          pip install python-semantic-release
          pip install "GitPython<3.1.44"

      # 2. Calculate next version and push the Git Tag using the local installation
      - name: Python Semantic Release
        env:
          # Pass the GitHub Token so semantic-release can push the tag
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release -v version --no-commit

      # 3. Install Hatch on the actual runner machine
      - name: Install Build Tools
        run: pip install hatch

      # 4. Build your actual library wheel files
      - name: Build Distribution Packages
        run: hatch build