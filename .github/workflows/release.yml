name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls all Git history/tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. Calculate next version and push the Git Tag (without making file commits)
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: "false" # Prevents the bot from creating commits in your branch

      # 2. Install Hatch on the actual runner machine
      - name: Install Build Tools
        run: pip install hatch

      # 3. Build your actual library wheel files
      - name: Build Distribution Packages
        run: hatch build
