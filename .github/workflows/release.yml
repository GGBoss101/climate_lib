name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls all Git history/tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This tool reads commit messages to decide if it's a major, minor, or patch bump
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}